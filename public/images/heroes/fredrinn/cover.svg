  <circle cx="1180" cy="226" r="252" fill="url(#fredrinn-cover-aura)"/>
  <path d="M278 248h350m-80 136h420m-260 132h470" stroke="#fff4dd" stroke-opacity="0.22" stroke-width="22" stroke-linecap="round"/>
  <path d="M230 656 520 182l280 178 278-118 292 414" fill="none" stroke="#f5c36b" stroke-opacity="0.44" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1116" y="610" fill="#ffffff" fill-opacity="0.08" font-family="Arial, sans-serif" font-size="332" font-weight="700" letter-spacing="-24">FR</text>
