<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Fredrinn cover art placeholder</title>
  <desc id="desc">Gold rampart field for Fredrinn hero and article surfaces.</desc>
  <defs>
    <linearGradient id="fredrinn-cover-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181109"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <radialGradient id="fredrinn-cover-aura" cx="72%" cy="24%" r="42%">
      <stop offset="0%" stop-color="#f5c36b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#f5c36b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="fredrinn-grid" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M96 0H0V96" fill="none" stroke="#fff4dd" stroke-opacity="0.1"/>
