    </linearGradient>
    <radialGradient id="xavier-cover-aura" cx="72%" cy="24%" r="42%">
      <stop offset="0%" stop-color="#76e7ff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#76e7ff" stop-opacity="0"/>
