<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Xavier cover art placeholder</title>
  <desc id="desc">Light-beam geometry for Xavier hero and article surfaces.</desc>
