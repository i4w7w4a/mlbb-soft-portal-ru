<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Aamon cover art placeholder</title>
  <desc id="desc">Shard-like cyan motion field for Aamon hero and article surfaces.</desc>
  <defs>
    <linearGradient id="aamon-cover-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06111c"/>
      <stop offset="100%" stop-color="#03070f"/>
    </linearGradient>
    <radialGradient id="aamon-cover-aura" cx="70%" cy="24%" r="46%">
      <stop offset="0%" stop-color="#65e6ff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#65e6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="aamon-grid" width="92" height="92" patternUnits="userSpaceOnUse">
      <path d="M92 0H0V92" fill="none" stroke="#8fefff" stroke-opacity="0.14"/>
