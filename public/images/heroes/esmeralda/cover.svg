<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Esmeralda cover art placeholder</title>
  <desc id="desc">Orbital moon-glow field for Esmeralda hero and article surfaces.</desc>
  <defs>
    <linearGradient id="esmeralda-cover-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1730"/>
      <stop offset="100%" stop-color="#03070f"/>
    </linearGradient>
    <radialGradient id="esmeralda-cover-aura" cx="66%" cy="28%" r="44%">
      <stop offset="0%" stop-color="#8cb6ff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#8cb6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="esmeralda-grid" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M96 0H0V96" fill="none" stroke="#dfe8ff" stroke-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#esmeralda-cover-bg)"/>
  <rect width="1600" height="900" fill="url(#esmeralda-grid)" opacity="0.4"/>
  <circle cx="1040" cy="242" r="272" fill="url(#esmeralda-cover-aura)"/>
  <circle cx="944" cy="404" r="224" fill="none" stroke="#eef5ff" stroke-opacity="0.32" stroke-width="12"/>
  <circle cx="944" cy="404" r="312" fill="none" stroke="#8cb6ff" stroke-opacity="0.26" stroke-width="10"/>
  <path d="M238 612c170-254 356-340 560-258" fill="none" stroke="#eef5ff" stroke-opacity="0.76" stroke-width="18" stroke-linecap="round"/>
  <path d="M300 742c194-144 480-162 760-56" fill="none" stroke="#8cb6ff" stroke-opacity="0.42" stroke-width="12" stroke-linecap="round"/>
  <text x="1084" y="616" fill="#ffffff" fill-opacity="0.08" font-family="Arial, sans-serif" font-size="332" font-weight="700" letter-spacing="-24">ES</text>
  <rect x="100" y="104" width="196" height="44" rx="22" fill="#8cb6ff" fill-opacity="0.14" stroke="#8cb6ff" stroke-opacity="0.36"/>
  <text x="198" y="134" fill="#eef5ff" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4" text-anchor="middle">LUNAR TIDE</text>
  <text x="100" y="786" fill="#eef5ff" fill-opacity="0.82" font-family="Arial, sans-serif" font-size="26" letter-spacing="4">MAGE / TANK</text>
  <text x="350" y="786" fill="#eef5ff" fill-opacity="0.82" font-family="Arial, sans-serif" font-size="26" letter-spacing="4">EXP / MID</text>
  <text x="100" y="834" fill="#ffffff" fill-opacity="0.42" font-family="Arial, sans-serif" font-size="34" letter-spacing="6">ABSORBENT ORBITAL PRESSURE</text>
</svg>
